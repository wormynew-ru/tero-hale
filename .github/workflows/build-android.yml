name: Build Android Release APK (Godot 4.7.2-stable)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'godot_project/**'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'
  GODOT_TEMPLATE_DIR: '4.7.2.stable'
  APK_OUTPUT_NAME: 'hero-tale-release.apk'

jobs:
  build-android-apk:
    name: Build Release APK (Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ env.GODOT_TAG }}-${{ hashFiles('godot_project/export_presets.cfg') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-${{ env.GODOT_TAG }}-

      - name: Install Android SDK components (API 36, Build-Tools 36.1.0, NDK 29)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "cmdline-tools;latest" \
            "build-tools;36.1.0" \
            "platforms;android-36" \
            "cmake;3.10.2.4988404" \
            "ndk;29.0.14206865"

      - name: Cache Godot 4.7.2-stable & Export Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-ci
          key: godot-${{ runner.os }}-${{ env.GODOT_TAG }}

      - name: Download & Install Godot 4.7.2-stable + Export Templates
        run: |
          mkdir -p ~/.cache/godot-ci
          EDITOR_ZIP="$HOME/.cache/godot-ci/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          TEMPLATES_TPZ="$HOME/.cache/godot-ci/Godot_v${GODOT_TAG}_export_templates.tpz"

          if [ ! -f "$EDITOR_ZIP" ]; then
            curl -fSL -o "$EDITOR_ZIP" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          fi

          if [ ! -f "$TEMPLATES_TPZ" ]; then
            curl -fSL -o "$TEMPLATES_TPZ" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          fi

          unzip -q -o "$EDITOR_ZIP" -d /tmp/godot_editor
          sudo mv "/tmp/godot_editor/Godot_v${GODOT_TAG}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$TEMPLATE_TARGET" /tmp/godot_templates
          unzip -q -o "$TEMPLATES_TPZ" -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "$TEMPLATE_TARGET/"

      - name: Install Android Gradle Build Template (res://android/build)
        run: |
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p godot_project/android/build
          unzip -q -o "$TEMPLATE_TARGET/android_source.zip" -d godot_project/android/build
          printf '%s' "${GODOT_TEMPLATE_DIR}" > godot_project/android/.build_version
          if [ -f godot_project/android/build/gradlew ]; then
            chmod +x godot_project/android/build/gradlew
          fi

      - name: Configure Godot Editor Settings (Android SDK & JDK)
        run: |
          CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          mkdir -p "$CONFIG_DIR"
          for FILE_NAME in editor_settings-4.7.tres editor_settings-4.tres; do
            printf '[godot_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "${ANDROID_HOME}" "${JAVA_HOME}" > "$CONFIG_DIR/$FILE_NAME"
          done

      - name: Import Godot Project Resources Headlessly
        run: |
          timeout 180 godot --headless --path godot_project --import
          CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          for FILE_NAME in editor_settings-4.7.tres editor_settings-4.tres; do
            if [ -f "$CONFIG_DIR/$FILE_NAME" ]; then
              grep -q 'export/android/android_sdk_path' "$CONFIG_DIR/$FILE_NAME" || \
                printf '\nexport/android/android_sdk_path = "%s"\n' "${ANDROID_HOME}" >> "$CONFIG_DIR/$FILE_NAME"
              grep -q 'export/android/java_sdk_path' "$CONFIG_DIR/$FILE_NAME" || \
                printf 'export/android/java_sdk_path = "%s"\n' "${JAVA_HOME}" >> "$CONFIG_DIR/$FILE_NAME"
            fi
          done

      - name: Prepare Release Keystore (Secrets or Ephemeral Release Key)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="/tmp/android-release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_ALIAS" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Using repository release keystore from GitHub Secrets..."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            KEYSTORE_ALIAS="$ANDROID_KEYSTORE_ALIAS"
            KEYSTORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "No release keystore secrets configured; generating temporary release keystore..."
            KEYSTORE_ALIAS="hero_tale_release"
            KEYSTORE_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$KEYSTORE_PASS"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEYSTORE_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype PKCS12 \
              -dname "CN=Hero Tale Idle RPG, O=HeroTale, C=US" \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEYSTORE_PASS"
          fi

          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASS"
          } >> "$GITHUB_ENV"

          python3 -c '
          import pathlib, re, sys
          ks_path, ks_user, ks_pass = sys.argv[1], sys.argv[2], sys.argv[3]
          cfg_path = pathlib.Path("godot_project/export_presets.cfg")
          text = cfg_path.read_text(encoding="utf-8")
          text = re.sub(r"^keystore/release=.*$", f"keystore/release=\"{ks_path}\"", text, flags=re.M)
          text = re.sub(r"^keystore/release_user=.*$", f"keystore/release_user=\"{ks_user}\"", text, flags=re.M)
          text = re.sub(r"^keystore/release_password=.*$", f"keystore/release_password=\"{ks_pass}\"", text, flags=re.M)
          cfg_path.write_text(text, encoding="utf-8")
          ' "$KEYSTORE_PATH" "$KEYSTORE_ALIAS" "$KEYSTORE_PASS"

      - name: Export Release APK via Gradle (No Debug)
        run: |
          mkdir -p godot_project/build
          godot --headless --verbose --path godot_project --export-release "Android" "build/${APK_OUTPUT_NAME}"
          ls -lh "godot_project/build/${APK_OUTPUT_NAME}"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-tale-android-release-apk
          path: godot_project/build/${{ env.APK_OUTPUT_NAME }}
          if-no-files-found: error

      - name: Attach Release APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: godot_project/build/${{ env.APK_OUTPUT_NAME }}
